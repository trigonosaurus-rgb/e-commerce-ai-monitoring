# Database migrations. The app applies them automatically on startup (backend/database.py);
# after changing backend/models.py create a new one with:
#   uv run alembic revision --autogenerate -m "describe the change"
[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = .
path_separator = os
# the database URL comes from the app settings (DATABASE_URL), see migrations/env.py
