[project]
name = "rivalscope"
version = "0.2.0"
description = "Competitor price monitoring with a transparent AI agent"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.15",
    "openai>=3.29.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.48",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["backend/migrations/versions"]  # generated by alembic

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["SIM102"]  # nested ifs are often clearer with a comment between them

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
